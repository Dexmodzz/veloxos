# VeloxOS — DankMaterialShell (gnomeAdwaita / slate) — tema kitty fisso
# Colori presi direttamente dal theme.json di DMS: ruoli M3 per surface/testo
# e gli accenti Adwaita del tema per i 16 colori ANSI.

# --- 16 colori ANSI (accenti Adwaita di DankMaterialShell) ---
color0  #36363a
color1  #e62d42
color2  #3a944a
color3  #c88800
color4  #3584e4
color5  #9141ac
color6  #2190a4
color7  #d6d6da
color8  #5e5c64
color9  #ff888c
color10 #8de698
color11 #ffc057
color12 #81d0ff
color13 #fba7ff
color14 #7bdff4
color15 #ffffff

# --- Superfici e testo (ruoli M3 slate) ---
background            #1d1d20
foreground            #ffffff
selection_foreground  #ffffff
selection_background  #36363a

cursor                #ffffff
cursor_text_color     #1d1d20
cursor_trail_color    #6f8396

active_border_color   #6f8396
inactive_border_color #36363a

url_color             #6f8396

# --- Tab bar (stile DankMaterialShell) ---
tab_bar_edge            top
tab_bar_style           powerline
tab_powerline_style     slanted
tab_bar_align           left
tab_bar_min_tabs        2

active_tab_foreground   #ffffff
active_tab_background   #6f8396
active_tab_font_style   bold
inactive_tab_foreground #908caa
inactive_tab_background #222226
inactive_tab_font_style normal
